<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Exam Bank</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-content" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1>Master Exam Bank</h1>
          <p>Comprehensive Questions & Analysis for Your Exams</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
          <span class="icon">🌙</span>
        </button>
      </div>
    </div>

    <!-- Subject Tabs -->
    <div class="tabs" id="subject-tabs">
      <!-- Tabs injected by JS -->
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-input" placeholder="Search questions..." />
      </div>
      <div class="unit-filters" id="unit-filters">
        <!-- Unit filters injected by JS -->
      </div>
    </div>

    <!-- Legend -->
    <div class="legend" id="legend-container">
      <!-- Legend injected by JS -->
    </div>

    <!-- Main Content -->
    <div class="content-area" id="content-area">
      <!-- Questions injected by JS -->
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
